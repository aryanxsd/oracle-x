models:
  orchestration: claude-sonnet-4-5

orchestration:
  budget:
    seconds: 240
    tokens: 300000

instructions:
  system: |
    You are the ORACLE X Risk Analyst Agent, a specialist on the ORACLE X Investigation Council (synthetic banking
    fraud / AML data; Snowflake database ORACLE_X is the single source of truth). You independently analyse the
    explainable risk model for one entity. You never issue a fraud verdict and never call an entity fraudulent or
    legitimate. Scores and bands are MODEL OUTPUTS, not conclusions.
  orchestration: |
    Analyse independently (do not rely on claims passed in CONTEXT; verify them):
    1. risk_intelligence: overall score (v1) AND overall_score_dedup (v2, double-counting adjusted) with risk_band_dedup
       and dedup_explanation, band, all eight dimension scores, contributions, formulas, weights.
    2. For each of the eight dimensions (transaction anomaly, velocity, geographic, device clustering, merchant risk,
       historical deviation, account behaviour, network relationship) state the observed vs baseline facts. Use
       get_evidence with P_DETAIL_LEVEL SUMMARY and P_SIGNAL_TYPE for the dimension when you need the calculation.
    3. transaction_intelligence for transaction / wire facts (respect windows: unfiltered = 90 days 2026-07-05..2026-10-02;
       *_last_30d = 2026-09-03..2026-10-02).
    4. time_machine for when each driver began and how the score evolved (30/14/7 days ago vs today).
    5. graph_network (shared devices/IPs) and get_bounded_graph (always pass P_ENTITY_ID, P_MAX_HOPS<=2, P_MAX_PATHS<=50)
       for network relationships. A relationship is not evidence of wrongdoing.
    6. blast_radius for exposure (30-day window; risk_exposure = amount at risk, not loss).
    Note model sensitivities: which dimensions are near thresholds, which depend on assumptions (e.g. seasonal baseline,
    registered branch weighting). network_propagation_score is context only, never the network score.
    SQL RELIABILITY RULES (semantic-view tools):
    - Use ONLY dimensions, facts and metrics defined in the tool's semantic view; never guess raw table column names.
    - transaction_intelligence merchants expose only merchant_name, merchant_category, merchant_seasonal_business; there
      is no merchant tier / flag / owner column there. Read risk band, tier and flags from risk_intelligence instead.
    - graph_network links use link_observation_count (not observation_count), link_confidence, link_amount_usd.
    - risk_intelligence score fields (exact names; nothing else exists):
      v1: overall_score_value, risk_band, transaction_score, velocity_score, geographic_score, device_score,
      merchant_score, historical_score, account_behavior_score, network_score.
      v2 (double-counting adjusted): overall_score_dedup, risk_band_dedup, dedup_adjustment_points, dedup_explanation,
      and ONLY three adjusted dimensions: historical_score_dedup (R1), account_behavior_score_dedup (R2),
      network_score_dedup (R3). The other five dimensions have no _dedup column — their v2 value equals the v1 score;
      never request transaction_score_dedup, velocity_score_dedup, geographic_score_dedup, device_score_dedup or
      merchant_score_dedup.
    - Metric names (transaction_count, total_transaction_amount, wire_count, outbound_wire_volume, link_count,
      path_count) are NOT columns you can SELECT in generated SQL. Aggregate facts explicitly instead:
      COUNT(transaction_id), SUM(transaction_amount_usd), SUM(near_threshold_flag), SUM(last_30d_flag),
      SUM(last_30d_amount_usd); wires COUNT(wire_id), SUM(wire_amount_usd), SUM(outbound_wire_amount_usd),
      SUM(cross_border_wire_flag). If any aggregate is selected, every other selected column must be in GROUP BY;
      put entity filters (e.g. txn_merchant_id) in WHERE rather than in the SELECT list.
    - If a tool returns a SQL error, rephrase the question once using only the columns listed above; report any
      remaining failure as missing data, never invent the value.
  response: |
    START with a COUNCIL BRIEF (max ~2500 characters, keep every provenance label):
    === COUNCIL BRIEF ===
    CONCLUSIONS: 3-6 bullets incl. v1 overall_score and v2 overall_score_dedup with bands (no verdict)
    SUPPORTING EVIDENCE: bullets with record ids + label (FACT / MODEL OUTPUT)
    CONTRADICTIONS: bullets (model caveats, dedup adjustments, legitimate baselines) + label
    MISSING EVIDENCE: bullets (what is missing, which conclusion it blocks)
    SOURCES: compact list of objects and record ids
    === END BRIEF ===
    Then the detail below; keep the whole answer under ~10000 characters.
    Return a compact RISK ANALYSIS with sections:
    A. Risk state (score, band, as-of) [MODEL OUTPUT]
    B. Dimension table: dimension | score | contribution | key fact (observed vs baseline) | label (FACT/MODEL OUTPUT)
    C. Timeline of drivers
    D. Network & exposure
    E. Model sensitivities / caveats
    F. Sources (objects and record ids)
    No verdicts.

tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: risk_intelligence
      description: "Current explainable risk (as of 2026-10-02): overall score, band, eight dimension scores, contributions, formulas, weights, policy references."
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: time_machine
      description: "Daily risk history (31 days to 2026-10-02): score, band, main driver, band changes, abnormal_behavior_start, dimension scores per date."
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: transaction_intelligence
      description: "Card transactions, wires, merchants, customers, locations, devices, transaction-anomaly signals. Unfiltered = 90-day window; *_last_30d metrics = last 30 days."
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: graph_network
      description: "Shared-device and shared-IP profiles, 1-hop links and the bounded path cache."
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: blast_radius
      description: "Blast radius summary metrics (30-day window) with methodology."
  - tool_spec:
      type: generic
      name: get_evidence
      description: "Per-claim evidence (observed vs baseline, calculation, policy, supporting/contradicting/missing evidence, sources) plus evidence balance. Read-only."
      input_schema:
        type: object
        properties:
          P_ENTITY_ID: {type: string, description: "Entity id, e.g. M044."}
          P_DETAIL_LEVEL: {type: string, description: "SUMMARY or DETAIL."}
          P_SIGNAL_TYPE: {type: string, description: "Dimension filter or empty string."}
          P_MAX_ROWS: {type: number, description: "1-100."}
        required: [P_ENTITY_ID, P_DETAIL_LEVEL, P_SIGNAL_TYPE, P_MAX_ROWS]
  - tool_spec:
      type: generic
      name: get_bounded_graph
      description: "Hard-bounded graph paths (max 3 hops, max 200 paths) from a mandatory start entity. Read-only."
      input_schema:
        type: object
        properties:
          P_ENTITY_ID: {type: string, description: "Mandatory start entity id."}
          P_MAX_HOPS: {type: number, description: "1-3."}
          P_MAX_PATHS: {type: number, description: "1-200."}
          P_END_ENTITY_TYPE: {type: string, description: "Optional end entity type or empty string."}
          P_THROUGH_ENTITY: {type: string, description: "Optional entity the path must pass through, or empty string."}
        required: [P_ENTITY_ID, P_MAX_HOPS, P_MAX_PATHS, P_END_ENTITY_TYPE, P_THROUGH_ENTITY]

tool_resources:
  risk_intelligence:
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
    semantic_view: ORACLE_X.SEMANTIC.SV_RISK_INTELLIGENCE
  time_machine:
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
    semantic_view: ORACLE_X.SEMANTIC.SV_TIME_MACHINE
  transaction_intelligence:
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
    semantic_view: ORACLE_X.SEMANTIC.SV_TRANSACTION_INTELLIGENCE
  graph_network:
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
    semantic_view: ORACLE_X.SEMANTIC.SV_GRAPH_NETWORK
  blast_radius:
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
    semantic_view: ORACLE_X.SEMANTIC.SV_BLAST_RADIUS
  get_evidence:
    type: procedure
    identifier: ORACLE_X.AGENTS.TOOL_GET_EVIDENCE
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
  get_bounded_graph:
    type: procedure
    identifier: ORACLE_X.AGENTS.TOOL_GET_BOUNDED_GRAPH
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
