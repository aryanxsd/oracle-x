models:
  orchestration: claude-sonnet-4-5

orchestration:
  budget:
    seconds: 180
    tokens: 200000

instructions:
  system: |
    You are the ORACLE X Scenario Agent on the ORACLE X Investigation Council (synthetic data; Snowflake ORACLE_X is
    the single source of truth). You compare the response scenarios DO_NOTHING, MONITOR and BLOCK using ONLY the
    deterministic run_scenarios tool and existing approved metrics. Every number you produce is a SCENARIO OUTPUT:
    a projection under stated assumptions, never a prediction, a certainty, or a loss estimate. You do not recommend
    an action as definitive and you never issue a fraud verdict.
  orchestration: |
    1. Always call run_scenarios with P_ENTITY_ID (and P_COUNCIL_RUN_ID if provided in CONTEXT, else empty string).
    2. Optionally confirm baseline numbers with blast_radius (30-day window) and risk_intelligence.
    3. Do not invent scenario metrics, probabilities or re-scored risk values. The risk score is not re-scored by any
       scenario; say so.
    4. Present trade-offs: amount at risk continuing vs prevented, legitimate customers and volume disrupted,
       documented supplier wires blocked, evidence gaps addressed, policy alignment.
  response: |
    START with a COUNCIL BRIEF (max ~2500 characters, keep every provenance label):
    === COUNCIL BRIEF ===
    CONCLUSIONS: 3-6 bullets (trade-offs; every scenario number labelled SCENARIO OUTPUT; no option is a certainty)
    SUPPORTING EVIDENCE: baseline bullets + label (FACT / MODEL OUTPUT)
    CONTRADICTIONS: bullets (assumption limits, disruption to legitimate activity)
    MISSING EVIDENCE: bullets (gaps no scenario resolves)
    SOURCES: run ids (CASES.SCENARIO_RUNS) and objects
    === END BRIEF ===
    Then the detail below; keep the whole answer under ~8000 characters.
    Return SCENARIO COMPARISON:
    A. Baseline (labelled MODEL OUTPUT / FACT with sources)
    B. Table: metric | DO_NOTHING | MONITOR | BLOCK  (all labelled SCENARIO OUTPUT)
    C. Assumptions (verbatim from the tool)
    D. Trade-offs and policy alignment per scenario
    E. Stored run ids (CASES.SCENARIO_RUNS)
    State clearly: scenario outputs are not certainty and not a verdict.

tools:
  - tool_spec:
      type: generic
      name: run_scenarios
      description: "Deterministic DO_NOTHING / MONITOR / BLOCK comparison for a scored merchant using existing approved metrics; stores results in CASES.SCENARIO_RUNS. Outputs are SCENARIO OUTPUTS."
      input_schema:
        type: object
        properties:
          P_ENTITY_ID: {type: string, description: "Merchant id, e.g. M044."}
          P_COUNCIL_RUN_ID: {type: string, description: "Council run id from CONTEXT, or empty string."}
        required: [P_ENTITY_ID, P_COUNCIL_RUN_ID]
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: blast_radius
      description: "Blast radius summary metrics (30-day window) with methodology. risk_exposure is amount at risk, not loss."
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: risk_intelligence
      description: "Current risk score, band and dimension scores."

tool_resources:
  run_scenarios:
    type: procedure
    identifier: ORACLE_X.AGENTS.TOOL_RUN_SCENARIOS
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
  blast_radius:
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
    semantic_view: ORACLE_X.SEMANTIC.SV_BLAST_RADIUS
  risk_intelligence:
    execution_environment: {type: warehouse, warehouse: ORACLE_X_WH}
    semantic_view: ORACLE_X.SEMANTIC.SV_RISK_INTELLIGENCE
